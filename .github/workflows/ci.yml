name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Buildix.API/Buildix.API.csproj

      - name: Build
        run: dotnet build Buildix.API/Buildix.API.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Buildix.Tests/Buildix.Tests.csproj --configuration Release --verbosity normal

  deploy-config:
    # The edge config is what actually terminates TLS in production, and a typo
    # there only shows up as a container that refuses to start. Validate it here
    # rather than on the server.
    name: Deploy config (compose + nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose --env-file .env.example config -q

      - name: Validate nginx configs
        run: |
          set -eu
          for f in default.ssl.conf default.conf; do
            echo "── $f"
            # `api` is only resolvable inside the compose network; the cert is
            # created by the same start-up script the image ships with.
            docker run --rm --add-host api:127.0.0.1 \
              -v "$PWD/deploy/nginx/$f:/etc/nginx/conf.d/default.conf:ro" \
              -v "$PWD/deploy/nginx/ensure-cert.sh:/tmp/ensure-cert.sh:ro" \
              nginx:1.27-alpine \
              sh -c "apk add --no-cache openssl >/dev/null && sh /tmp/ensure-cert.sh >/dev/null && nginx -t"
          done

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Buildix.Web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Buildix.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
