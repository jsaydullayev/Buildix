          <a href="https://t.me/buildix_admin" style="display:flex;align-items:center;gap:9px;font-size:13.5px;color:#334155" style-hover="color:#2563eb"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3 2 10.5l5.5 2L18 6l-8 8v5l3-3 4.5 3.5z"></path></svg>@buildix_admin</a>
        </div>

    </div>
    <div style="align-self:center;font-size:12px;color:#cbd5e1">© 2026 Buildix · Strotech</div>
