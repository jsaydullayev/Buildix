<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f6f8fb;font-family:'Golos Text',system-ui,sans-serif}
a{color:#2563eb;text-decoration:none}a:hover{color:#1e40af}
</style>
</helmet>
<div data-screen-label="Seller Notifications" style="width:100%;min-width:1360px;min-height:100vh;display:flex;flex-direction:column;background:#f6f8fb;color:#0f172a">

  <div style="flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:62px;background:#0f2557;color:#ffffff">
    <div style="display:flex;align-items:center;gap:14px">
      
      <div style="display:flex;align-items:center;gap:4px;font-size:13.5px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:3px;flex:none">
        <a href="Seller POS.dc.html" style="display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:8px;white-space:nowrap;font-weight:500;color:rgba(255,255,255,.6)" style-hover="color:#ffffff;background:rgba(255,255,255,.08)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6"></path><path d="M9 12h6"></path></svg>Касса</a>
        <a href="Seller Sales.dc.html" style="display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:8px;white-space:nowrap;font-weight:500;color:rgba(255,255,255,.6)" style-hover="color:#ffffff;background:rgba(255,255,255,.08)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6"></path><path d="M9 12h6"></path><path d="M9 16h4"></path></svg>Мои продажи</a>
        <a href="Seller Products.dc.html" style="display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:8px;white-space:nowrap;font-weight:500;color:rgba(255,255,255,.6)" style-hover="color:#ffffff;background:rgba(255,255,255,.08)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5"></path><path d="M12 13v8"></path></svg>Товары</a>
        <a href="Seller Clients.dc.html" style="display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:8px;white-space:nowrap;font-weight:500;color:rgba(255,255,255,.6)" style-hover="color:#ffffff;background:rgba(255,255,255,.08)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3.5 20c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"></path><path d="M16 4.5a3.2 3.2 0 0 1 0 7"></path><path d="M17.5 15c1.9.5 3 2 3.5 5"></path></svg>Клиенты</a>
        <a href="Seller Debts.dc.html" style="display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:8px;white-space:nowrap;font-weight:500;color:rgba(255,255,255,.6)" style-hover="color:#ffffff;background:rgba(255,255,255,.08)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18"></path><path d="M16 15h2"></path></svg>Долги</a>
        <a href="Seller Supplies.dc.html" style="display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:8px;white-space:nowrap;font-weight:500;color:rgba(255,255,255,.6)" style-hover="color:#ffffff;background:rgba(255,255,255,.08)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 9h13v8H1z"></path><path d="M14 11h4l3 3v3h-7z"></path><circle cx="6" cy="19" r="1.6"></circle><circle cx="17.5" cy="19" r="1.6"></circle></svg>Поставки</a>
      </div>
    </div>
    <div style="flex:none;display:flex;align-items:center;gap:12px">
      <a href="Seller Shifts.dc.html" title="Мои смены" style="flex:none;white-space:nowrap;display:flex;align-items:center;gap:8px;background:rgba(22,163,74,.18);border:1px solid rgba(74,222,128,.4);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;color:#86efac;cursor:pointer" style-hover="background:rgba(22,163,74,.32);border:1px solid rgba(74,222,128,.7);color:#a7f3d0"><span style="width:6px;height:6px;border-radius:999px;background:#4ade80;flex:none"></span>Смена открыта · 08:00</a>
      <div style="position:relative;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.25);color:#ffffff"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span style="position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:999px;background:#dc2626;color:#ffffff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;box-sizing:border-box">{{ unread }}</span></div>
      <div style="flex:none;display:flex;align-items:center;gap:10px;border-left:1px solid rgba(255,255,255,.2);padding-left:12px">
        <a href="Seller Account.dc.html" title="Мой аккаунт" style="display:flex;align-items:center;gap:10px;border-radius:8px;padding:4px 8px;margin:-4px 0;color:#ffffff" style-hover="background:rgba(255,255,255,.1)">
          <div style="width:32px;height:32px;border-radius:999px;background:#2563eb;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">ЖТ</div>
          <div><div style="font-size:12.5px;font-weight:600;white-space:nowrap">Жасур Тошев</div><div style="font-size:10.5px;color:rgba(255,255,255,.5)">Продавец</div></div>
        </a>
        <a href="Login.dc.html" style="display:flex;color:rgba(255,255,255,.55)" style-hover="color:#ffffff"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg></a>
      </div>
    </div>
  </div>

  <div style="flex:1;padding:24px 28px 40px;display:flex;flex-direction:column;gap:16px;max-width:900px;width:100%;margin:0 auto;box-sizing:border-box">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:14px">
        <a href="javascript:history.back()" title="Назад" style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;background:#ffffff;border:1px solid #e2e8f0;color:#475569;flex:none" style-hover="border:1px solid #2563eb;color:#2563eb"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg></a>
        <div>
        <div style="font-size:20px;font-weight:600;letter-spacing:-.2px">Уведомления</div>
        <div style="font-size:12.5px;color:#94a3b8;margin-top:2px">{{ unread }} непрочитанных</div>
        </div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <div style="display:inline-flex;background:#ffffff;border:1px solid #e2e8f0;border-radius:999px;padding:3px">
          <div onClick="{{ showAll }}" style="padding:7px 16px;border-radius:999px;font-size:12.5px;font-weight:{{ allW }};color:{{ allC }};background:{{ allBg }};cursor:pointer">Все</div>
          <div onClick="{{ showUnread }}" style="padding:7px 16px;border-radius:999px;font-size:12.5px;font-weight:{{ unrW }};color:{{ unrC }};background:{{ unrBg }};cursor:pointer">Непрочитанные</div>
        </div>
        <button onClick="{{ markAll }}" type="button" style="height:38px;padding:0 16px;border:1px solid #cbd5e1;border-radius:9px;background:#ffffff;color:#475569;font-size:12.5px;font-weight:600;font-family:'Golos Text',sans-serif;cursor:pointer" style-hover="border:1px solid #2563eb;color:#2563eb">Отметить все прочитанными</button>
      </div>
    </div>

    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="font-size:11.5px;font-weight:600;letter-spacing:.6px;color:#94a3b8;margin-top:6px">{{ g.label }}</div>
        <sc-for list="{{ g.items }}" as="n" hint-placeholder-count="3">
          <div onClick="{{ n.read }}" style="display:flex;gap:14px;align-items:flex-start;background:{{ n.bg }};border:1px solid {{ n.bd }};border-radius:13px;padding:16px 18px;cursor:pointer" style-hover="box-shadow:0 6px 16px rgba(15,23,42,.07)">
            <div style="width:40px;height:40px;border-radius:10px;background:{{ n.icBg }};display:flex;align-items:center;justify-content:center;flex:none;font-size:17px">{{ n.icon }}</div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:8px">
                <div style="font-size:14px;font-weight:600">{{ n.title }}</div>
                <sc-if value="{{ n.isNew }}" hint-placeholder-val="{{ false }}"><span style="width:8px;height:8px;border-radius:999px;background:#2563eb;flex:none"></span></sc-if>
              </div>
              <div style="font-size:13px;line-height:1.5;color:#64748b;margin-top:3px">{{ n.text }}</div>
              <div style="display:flex;align-items:center;gap:12px;margin-top:8px">
                <a href="{{ n.href }}" style="font-size:12.5px;font-weight:600">{{ n.action }}</a>
                <span style="font-size:11.5px;color:#94a3b8">{{ n.time }}</span>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { filter: 'all', readIds: [] };
  renderVals() {
    const N = [
      { id: 1, day: 'СЕГОДНЯ', icon: '🚚', icBg: '#dcfce7', title: 'Поставка П-214 прибыла', text: 'ООО «ЦементТрейд» — цемент М500/М400, песок. Ожидает приёмки.', action: 'Открыть поставки', href: 'Seller Supplies.dc.html', time: '13:40', unread: true },
      { id: 2, day: 'СЕГОДНЯ', icon: '⏰', icBg: '#fff7ed', title: 'Срок оплаты долга — сегодня', text: 'Бекзод Алимов — 3 800 000 сум. Напомните клиенту при визите.', action: 'Открыть долги', href: 'Seller Debts.dc.html', time: '09:00', unread: true },
      { id: 3, day: 'СЕГОДНЯ', icon: '📦', icBg: '#fef2f2', title: 'Гипсокартон 12,5 мм закончился', text: 'Остаток 0. Товар недоступен для продажи до прихода.', action: 'Открыть товары', href: 'Seller Products.dc.html', time: '08:12', unread: true },
      { id: 4, day: 'ВЧЕРА', icon: '🚚', icBg: '#eff6ff', title: 'Поставка П-215 в пути', text: '«Металл Сервис» — арматура, труба, сетка. Прибытие: сегодня к 16:00.', action: 'Открыть поставки', href: 'Seller Supplies.dc.html', time: '18:30', unread: false },
      { id: 5, day: 'ВЧЕРА', icon: '⚠️', icBg: '#fef2f2', title: 'Долг просрочен', text: 'ФХ «Олтин Дала» — 5 200 000 сум, просрочка 3 дня. Продажа в долг заблокирована.', action: 'Открыть долги', href: 'Seller Debts.dc.html', time: '09:00', unread: false },
      { id: 6, day: 'ВЧЕРА', icon: '✅', icBg: '#f0fdf4', title: 'Смена закрыта', text: 'Пятница, 18 июля: 11 020 000 сум, 41 чек. Отчёт отправлен владельцу.', action: 'Мои смены', href: 'Seller Shifts.dc.html', time: '20:11', unread: false },
    ];
    const isRead = (n) => !n.unread || this.state.readIds.includes(n.id);
    const visible = N.filter(n => this.state.filter === 'all' || !isRead(n));
    const groups = ['СЕГОДНЯ', 'ВЧЕРА'].map(day => ({
      label: day,
      items: visible.filter(n => n.day === day).map(n => ({
        ...n,
        isNew: !isRead(n),
        bg: isRead(n) ? '#ffffff' : '#f5f9ff',
        bd: isRead(n) ? '#e8edf4' : '#bfdbfe',
        read: () => this.setState(s => ({ readIds: s.readIds.includes(n.id) ? s.readIds : [...s.readIds, n.id] })),
      })),
    })).filter(g => g.items.length > 0);
    const unread = N.filter(n => !isRead(n)).length;
    const chip = (k, active) => ({
      [`${k}W`]: active ? '600' : '500',
      [`${k}C`]: active ? '#ffffff' : '#64748b',
      [`${k}Bg`]: active ? '#2563eb' : 'transparent',
    });
    return {
      groups, unread,
      ...chip('all', this.state.filter === 'all'),
      ...chip('unr', this.state.filter === 'unread'),
      showAll: () => this.setState({ filter: 'all' }),
      showUnread: () => this.setState({ filter: 'unread' }),
      markAll: () => this.setState({ readIds: N.map(n => n.id) }),
    };
  }
}
</script>
</body>
</html>
