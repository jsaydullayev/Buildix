# Buildix edge — serves the SPA and reverse-proxies the API/hubs.
#
# HTTP-only variant. Ikki holatda ishlatiladi:
#   1. lokal ishga tushirish;
#   2. serverda OLDINDAN reverse proxy bor bo'lsa (bir nechta loyiha bitta
#      mashinada) — TLS o'sha tashqi proxy'da tugaydi, Buildix esa oddiy HTTP
#      bilan ichki portda turadi. Bu holatda `.env` da `NGINX_CONF=default.conf`
#      va `WEB_HTTP_PORT=127.0.0.1:8090` qo'yiladi. Batafsil: deploy/README.md §2b.
#
# TLS ni Buildix'ning o'zi tugatadigan holat — default.ssl.conf.
# compose tanlangan faylni /etc/nginx/conf.d/default.conf ga ulaydi, ya'ni tahrir
# `docker compose restart web` dan keyin kuchga kiradi.

# Foydalanuvchi HTTPS bilan kelgan-kelmaganini SAQLAB qolish.
#
# Tashqi proxy ortida turganda bu blok muhim: $scheme bu yerda doim "http"
# bo'ladi (tashqi proxy bizga oddiy HTTP bilan uzatadi), shuning uchun
# X-Forwarded-Proto ni ko'r-ko'rona $scheme bilan yozish tashqi proxy qo'ygan
# "https" ni O'CHIRIB yuboradi — API foydalanuvchi HTTP da deb o'ylaydi va
# hosil qiladigan havolalar, cookie'lar hamda redirect'lar buziladi.
# Sarlavha bo'lmasa (to'g'ridan-to'g'ri kirish) $scheme ga qaytamiz.
map $http_x_forwarded_proto $buildix_fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Uploaded product images can be a few MB; nginx's 1m default would 413 them.
    client_max_body_size 20m;

    # ── Sog'liq (health) ─────────────────────────────────────────────────
    # Faqat ichki tarmoqdan — holat ma'lumoti tashqariga chiqmaydi.
    location = /api/health {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        proxy_pass       http://api:8080/health;
        proxy_set_header Host $host;
    }

    # Konteyner healthcheck'i.
    location = /healthz {
        access_log off;
        return 200 "ok
";
    }

    # ── API ──────────────────────────────────────────────────────────────
    # /api/uploads/... (product images) is also served by the API, so everything
    # under /api goes to the app container.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $buildix_fwd_proto;
        proxy_read_timeout 120s;
    }

    # ── SignalR (WebSocket) ──────────────────────────────────────────────
    location /hubs/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $buildix_fwd_proto;
        proxy_read_timeout 3600s;   # long-lived hub connections
    }

    # ── Desktop yangilanishlari ──────────────────────────────────────────
    # Batafsil izoh — default.ssl.conf da (bu ochiq HTTP varianti faqat
    # lokal ishlash uchun; do'konlar HTTPS orqali yangilanadi).
    location ~ ^/updates/.*(releases\.win\.json|RELEASES|assets\.win\.json)$ {
        root /srv;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /updates/ {
        root /srv;
        autoindex off;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA ──────────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed Vite assets — safe to cache aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA manifest — served from public/, so it has no content hash. default_type
    # is a no-op when nginx's mime.types already maps .webmanifest, and supplies
    # the correct type when it doesn't.
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Brand icons (public/) — stable names, so cache for a week rather than 1y.
    location ~* ^/(favicon\.svg|favicon-\d+\.png|apple-touch-icon\.png|app-icon-\d+\.png|brand/.+)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Client-side routes (/, /:subdomain/login, /:subdomain/pos, …) fall back to
    # the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
