# Buildix edge — serves the SPA and reverse-proxies the API/hubs.
#
# HTTP-only variant: works out of the box (no TLS certs required) — good for
# local runs and staging. For PRODUCTION, swap in default.ssl.conf.example
# (adds :443 + HTTP→HTTPS redirect) after mounting certificates. See
# deploy/README.md. This file is bind-mounted by docker-compose to
# /etc/nginx/conf.d/default.conf, so edits apply on `docker compose restart web`.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Uploaded product images can be a few MB; nginx's 1m default would 413 them.
    client_max_body_size 20m;

    # ── API ──────────────────────────────────────────────────────────────
    # /api/uploads/... (product images) is also served by the API, so everything
    # under /api goes to the app container.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── SignalR (WebSocket) ──────────────────────────────────────────────
    location /hubs/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # long-lived hub connections
    }

    # ── SPA ──────────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed Vite assets — safe to cache aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/, /:subdomain/login, /:subdomain/pos, …) fall back to
    # the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
