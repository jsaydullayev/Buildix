# Buildix edge — PRODUCTION (TLS). Bu STANDART konfiguratsiya:
# docker-compose `NGINX_CONF` o'zgaruvchisi orqali aynan shu faylni ulaydi
# (`.env` da `NGINX_CONF=default.conf` qilib ochiq HTTP'ga qaytish mumkin —
# faqat lokal ishlash uchun).
#
# Sertifikat bo'lmasa konteyner yiqilmaydi: entrypoint (deploy/nginx/ensure-cert.sh)
# vaqtinchalik o'zi imzolagan sertifikat yaratadi, brauzer esa ogohlantirish
# ko'rsatib turadi. Haqiqiy sertifikat — deploy/README.md → «TLS».
#
# .NET tomonda UseHttpsRedirection ATAYIN o'chirilgan: TLS va HTTP→HTTPS
# yo'naltirish nginx zimmasida (Kestrel'dagi ikkinchi redirect halqa hosil qiladi).

# ── HTTP → HTTPS (+ certbot uchun ACME challenge) ──────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Certbot webroot — bu yo'l redirectdan OLDIN turishi shart, aks holda
    # yangilash (renew) so'rovi HTTPS'ga uchib ketib, tekshiruv yiqiladi.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Konteyner healthcheck'i — tashqariga chiqmaydi (faqat compose tarmog'i).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # HSTS — faqat HTTPS serverida (HTTP blokida bo'lsa, sertifikat muammosida
    # saytni butunlay ochib bo'lmay qolardi). 6 oy, subdomenlarsiz: preload
    # ro'yxatiga qo'shishdan oldin ataylab ehtiyot chorasi.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Yuklanadigan tovar rasmlari bir necha MB bo'lishi mumkin; nginx'ning
    # standart 1m chegarasi ularni 413 bilan rad etardi.
    client_max_body_size 20m;

    # ── Sog'liq (health) ─────────────────────────────────────────────────
    # Faqat ichki tarmoqdan: monitoring uchun ochiq qoldirilsa, u ma'lumotlar
    # bazasi holatini tashqariga oshkor qilardi.
    location = /api/health {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        proxy_pass       http://api:8080/health;
        proxy_set_header Host $host;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ── API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── SignalR (WebSocket) ──────────────────────────────────────────────
    location /hubs/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ── SPA ──────────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* ^/(favicon\.svg|favicon-\d+\.png|apple-touch-icon\.png|app-icon-\d+\.png|brand/.+)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
